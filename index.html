<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>KIA Dynamic Text Test</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>   
    <div id="form">
        <h1> Kia Dynamic Text</h1>

        <form id="form-kia">
            <label for="text">Car Name</label>
            <input type="text" id="car" name="car">
            
            <label for="text">Customer Name</label>
            <input type="text" id="customer" name="customer">
            
            <label for="start-time">Start Time</label>
            <input type="datetime-local" id="start-time" name="startTime">
            
            <label for="end-time">End Time</label>
            <input type="datetime-local" id="end-time" name="endTime">
            
            <button type="submit">Save</button>
        </form>

        <!-- <button id="scheduled-btn"> View Scheduled Dynamic Text</button> -->
    </div>
</body>
    <script src="script.js"></script>
</html>
